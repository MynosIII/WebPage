<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Voice of Customer conversion brief</title><desc id="desc">An abstract dashboard connecting customer language, recurring objections and a structured ecommerce content brief.</desc>
  <rect width="1200" height="675" fill="#0c1110"/><circle cx="985" cy="100" r="260" fill="#43d6a2" opacity=".10"/>
  <text x="72" y="88" fill="#43d6a2" font-family="Arial" font-size="20" font-weight="700" letter-spacing="3">VOICE OF CUSTOMER → CONVERSION</text>
  <text x="72" y="178" fill="#fff" font-family="Arial" font-size="66" font-weight="700">From review noise</text><text x="72" y="250" fill="#fff" font-family="Arial" font-size="66" font-weight="700">to a creative brief.</text>
  <g transform="translate(72 330)"><text fill="#8d9d97" font-family="Arial" font-size="17">RECURRING THEMES</text>
    <rect y="32" width="430" height="18" fill="#202c28"/><rect y="32" width="360" height="18" fill="#43d6a2"/><text x="445" y="48" fill="#fff" font-family="Arial" font-size="17">Effective removal · 135</text>
    <rect y="82" width="430" height="18" fill="#202c28"/><rect y="82" width="187" height="18" fill="#e76f51"/><text x="445" y="98" fill="#fff" font-family="Arial" font-size="17">Ineffective · 70</text>
    <rect y="132" width="430" height="18" fill="#202c28"/><rect y="132" width="152" height="18" fill="#e9a23b"/><text x="445" y="148" fill="#fff" font-family="Arial" font-size="17">Greasy residue · 57</text>
    <rect y="182" width="430" height="18" fill="#202c28"/><rect y="182" width="128" height="18" fill="#d66ca3"/><text x="445" y="198" fill="#fff" font-family="Arial" font-size="17">Unpleasant odor · 48</text></g>
  <g transform="translate(850 332)" font-family="Arial"><rect width="270" height="230" rx="8" fill="#151d1a" stroke="#43d6a2" stroke-opacity=".35"/><text x="28" y="47" fill="#43d6a2" font-size="15" font-weight="700" letter-spacing="2">OUTPUT</text><text x="28" y="90" fill="#fff" font-size="27" font-weight="700">Claim</text><text x="28" y="126" fill="#71807a" font-size="20">↓</text><text x="28" y="162" fill="#fff" font-size="27" font-weight="700">Proof</text><text x="28" y="198" fill="#71807a" font-size="20">↓</text><text x="28" y="222" fill="#43d6a2" font-size="18" font-weight="700">CONFIDENCE</text></g>
