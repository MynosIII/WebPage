<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Matías Gaglio — Portfolio</title>
  <meta name="description" content="Choose the Spanish or English edition of Matías Gaglio's ecommerce, analytics and creative strategy portfolio." />
  <meta name="robots" content="noindex,follow" />
  <link rel="canonical" href="https://matiasgaglio.onrender.com/" />
  <link rel="alternate" hreflang="en" href="https://matiasgaglio.onrender.com/index-en.html" />
  <link rel="alternate" hreflang="es" href="https://matiasgaglio.onrender.com/index-es.html" />
  <link rel="alternate" hreflang="x-default" href="https://matiasgaglio.onrender.com/" />
  <meta name="theme-color" content="#121212" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .language-entry { min-height:100vh; display:grid; place-items:center; padding:2rem; }
    .language-entry__card { width:min(720px,100%); padding:clamp(2rem,7vw,5rem); border:1px solid rgba(var(--color-acento-rgb),.3); border-radius:12px; background:var(--color-superficie); text-align:center; }
    .language-entry__eyebrow { color:var(--color-acento); font:700 .78rem var(--font-titulos); letter-spacing:.12em; text-transform:uppercase; }
    .language-entry h1 { margin:1rem 0 .8rem; font-size:clamp(2.8rem,8vw,5.4rem); line-height:.95; }
    .language-entry p { max-width:560px; margin:0 auto 2rem; color:var(--color-texto-sec); }
    .language-entry__actions { display:flex; flex-wrap:wrap; justify-content:center; gap:1rem; }
  </style>
  <script>
    (() => {
      const preferred = (navigator.languages?.[0] || navigator.language || '').toLowerCase();
      const destination = preferred.startsWith('es') ? 'index-es.html' : 'index-en.html';
      window.location.replace(destination);
    })();
  </script>
</head>
<body>
  <main class="language-entry" id="main-content">
    <section class="language-entry__card" aria-labelledby="language-title">
      <span class="language-entry__eyebrow">Matías Gaglio · Portfolio</span>
      <h1 id="language-title">Choose your language</h1>
      <p>Automatic redirection did not run. Select the portfolio edition you prefer.</p>
      <div class="language-entry__actions">
        <a class="cta-button" href="index-en.html" hreflang="en">Continue in English</a>
        <a class="cta-button secondary" href="index-es.html" hreflang="es">Continuar en español</a>
      </div>
    </section>
  </main>
</body>
</html>
