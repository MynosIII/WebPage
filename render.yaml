# This Render site is retired. The portfolio now lives at
# https://matiasgaglio.com (repository MynosIII/WebPage-Amazon).
# Every request is answered with a 301 to the same path on the new site, so old
# links, bookmarks and search results keep working while search engines move
# their index over. Only redirect-only/ is published so no old page can be
# served instead of the redirect.
services:
  - type: web
    runtime: static
    name: matiasgaglio
    branch: main
    buildCommand: echo "Legacy site retired; serving redirects to matiasgaglio.com"
    staticPublishPath: redirect-only
    pullRequestPreviewsEnabled: false
    routes:
      - type: redirect
        source: /*
        destination: https://matiasgaglio.com/*
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
