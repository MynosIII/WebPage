services:
  - type: web
    runtime: static
    name: matiasgaglio
    branch: main
    buildCommand: python3 scripts/build_homepages.py --check && python3 scripts/build_case_studies.py --check && python3 scripts/build_about_pages.py --check && python3 scripts/build_cv_pages.py --check && python3 scripts/sync_ecommerce_claims.py --check && python3 scripts/apply_legacy_translation_fixes.py --check && python3 scripts/validate_localization.py && python3 scripts/validate_project_claims.py && python3 scripts/generate_sitemap.py --check && python3 scripts/validate_site.py
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
