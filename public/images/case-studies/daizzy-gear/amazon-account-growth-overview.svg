    <text x="32" y="128" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="800" fill="#172033">$2,504</text>
    <text x="32" y="172" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#16834a">recovered momentum</text>
  </g>
  <g transform="translate(1070 285)">
