<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Prime Day recovery performance</title>
  <desc id="desc">Visualization of Prime Day sales recovery after advertising resumed, with total sales of 1268 dollars and ad sales of 1063 dollars during the event.</desc>
  <rect width="1600" height="900" fill="#f7f8fb"/>
  <rect x="100" y="80" width="1400" height="740" rx="36" fill="#ffffff" stroke="#d8dde8" stroke-width="3"/>
  <text x="150" y="160" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="800" fill="#172033">Prime Day Performance Recovery</text>
  <text x="150" y="212" font-family="Inter, Arial, sans-serif" font-size="26" fill="#596579">Event preparation, issue management, and post-pause momentum recovery</text>
  <g transform="translate(150 292)">
    <rect width="390" height="220" rx="28" fill="#eef4ff"/>
    <text x="32" y="60" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#516078">Prime Day Total Sales</text>
    <text x="32" y="138" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="850" fill="#172033">$1,268</text>
    <text x="32" y="182" font-family="Inter, Arial, sans-serif" font-size="25" fill="#596579">during June 23–26</text>
  </g>
  <g transform="translate(605 292)">
    <rect width="390" height="220" rx="28" fill="#f2f9f4"/>
    <text x="32" y="60" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#516078">Ad Sales</text>
    <text x="32" y="138" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="850" fill="#172033">$1,063</text>
    <text x="32" y="182" font-family="Inter, Arial, sans-serif" font-size="25" fill="#596579">after campaign activation</text>
  </g>
  <g transform="translate(1060 292)">
    <rect width="390" height="220" rx="28" fill="#fff4e7"/>
    <text x="32" y="60" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#516078">Ad ROAS</text>
    <text x="32" y="138" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="850" fill="#172033">1.11</text>
    <text x="32" y="182" font-family="Inter, Arial, sans-serif" font-size="25" fill="#596579">event benchmark</text>
  </g>
  <g transform="translate(190 590)">
    <line x1="0" y1="120" x2="1180" y2="120" stroke="#d8dde8" stroke-width="3"/>
    <circle cx="70" cy="120" r="22" fill="#223b8f"/>
    <circle cx="390" cy="120" r="22" fill="#d44b4b"/>
    <circle cx="710" cy="120" r="22" fill="#d44b4b"/>
    <circle cx="1030" cy="120" r="22" fill="#16834a"/>
    <text x="20" y="180" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">Prepared</text>
    <text x="310" y="180" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">Ads paused</text>
    <text x="630" y="180" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">Demand missed</text>
    <text x="945" y="180" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">Recovered</text>
    <path d="M70 120 C280 80 520 165 710 120 C845 88 930 58 1030 120" fill="none" stroke="#223b8f" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
