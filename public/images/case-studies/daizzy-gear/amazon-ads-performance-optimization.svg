<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Amazon Ads performance optimization</title>
  <desc id="desc">Dashboard-style visualization showing spend, ad sales, ROAS, CPC, impressions and clicks used for Amazon PPC optimization.</desc>
  <rect width="1600" height="900" fill="#f6f7fb"/>
  <rect x="92" y="72" width="1416" height="756" rx="34" fill="#ffffff" stroke="#d9deea" stroke-width="3"/>
  <text x="140" y="155" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="800" fill="#172033">Amazon Ads Optimization</text>
  <text x="140" y="207" font-family="Inter, Arial, sans-serif" font-size="26" fill="#596579">Bid control, search term refinement, campaign prioritization, and budget reallocation</text>
  <g transform="translate(140 280)">
    <rect width="285" height="150" rx="24" fill="#eef4ff"/>
    <text x="26" y="48" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#516078">Spend</text>
    <text x="26" y="105" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800" fill="#172033">$2,631</text>
  </g>
  <g transform="translate(465 280)">
    <rect width="285" height="150" rx="24" fill="#f2f9f4"/>
    <text x="26" y="48" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#516078">Ad Sales</text>
    <text x="26" y="105" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800" fill="#172033">$2,866</text>
  </g>
  <g transform="translate(790 280)">
    <rect width="285" height="150" rx="24" fill="#fff6e9"/>
    <text x="26" y="48" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#516078">ROAS</text>
    <text x="26" y="105" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800" fill="#172033">1.09</text>
  </g>
  <g transform="translate(1115 280)">
    <rect width="285" height="150" rx="24" fill="#f5edff"/>
    <text x="26" y="48" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#516078">CPC</text>
    <text x="26" y="105" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800" fill="#172033">$1.54</text>
  </g>
  <g transform="translate(180 520)">
    <rect x="0" y="0" width="570" height="210" rx="28" fill="#f8fafc" stroke="#d9deea" stroke-width="2"/>
    <text x="34" y="55" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#172033">Optimization Loop</text>
    <text x="34" y="105" font-family="Inter, Arial, sans-serif" font-size="25" fill="#596579">1. Analyze search terms and campaign results</text>
    <text x="34" y="145" font-family="Inter, Arial, sans-serif" font-size="25" fill="#596579">2. Lower bids where returns are weak</text>
    <text x="34" y="185" font-family="Inter, Arial, sans-serif" font-size="25" fill="#596579">3. Reallocate budget to stronger SKUs</text>
  </g>
  <g transform="translate(845 520)">
    <rect x="0" y="0" width="570" height="210" rx="28" fill="#f8fafc" stroke="#d9deea" stroke-width="2"/>
    <text x="34" y="55" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#172033">Traffic Signals</text>
    <text x="34" y="112" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#172033">130,071</text>
    <text x="245" y="112" font-family="Inter, Arial, sans-serif" font-size="25" fill="#596579">impressions</text>
    <text x="34" y="170" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#172033">1,712</text>
    <text x="185" y="170" font-family="Inter, Arial, sans-serif" font-size="25" fill="#596579">clicks reviewed for efficiency</text>
  </g>
</svg>
